<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>知识地图</title>
<style>
:root{color-scheme:light;--ink:#203d36;--muted:#61796e;--green:#197c61}*{box-sizing:border-box}body{margin:0;background:#f5f5ef;color:var(--ink);font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}header{padding:24px 30px 18px;background:#fbfcf8;border-bottom:1px solid #dce5d9}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--muted)}h1{font-size:27px;line-height:1.35;margin:6px 0 10px}#goal{max-width:960px;margin:0;color:#526d60}.topline{display:flex;align-items:center;gap:14px}.badge{font-size:12px;border:1px solid #d7e3cb;border-radius:20px;padding:2px 10px;background:#edf3e5;white-space:nowrap}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 26px;background:#fbfcf8;border-bottom:1px solid #dde6d8}.toolbar button,.toolbar a{font:inherit;font-size:13px;border:1px solid #cedccc;border-radius:8px;background:white;color:var(--ink);padding:6px 12px;cursor:pointer;text-decoration:none}.toolbar button:hover,.toolbar a:hover{background:#e7f0e2}.toolbar .help{margin-left:auto;font-size:12px;color:var(--muted)}.legend{display:flex;gap:12px;margin-top:10px;font-size:12px;color:var(--muted)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}.todo{background:#7c9682}.learning{background:#6596c8}.mastered{background:#218862}.skipped{background:#9d83b8}.workspace{position:relative;height:calc(100dvh - 250px);min-height:450px;overflow:hidden;background-image:radial-gradient(#c6d6c4 1px,transparent 1px);background-size:22px 22px}#stage{width:100%;height:100%;display:block;touch-action:none;cursor:grab}#stage.panning{cursor:grabbing}.edge{fill:none;stroke:#789b81;stroke-width:2.1;vector-effect:non-scaling-stroke}.card{height:100%;width:100%;border:1px solid #b9ceb9;border-top:5px solid #71967a;border-radius:17px;background:#fefffb;box-shadow:0 5px 14px #1e4b2310;padding:23px 24px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;overflow-wrap:anywhere}.card:hover,.card:focus,.card.selected{border-color:#2c8b66;outline:none;box-shadow:0 0 0 3px #277c6124}.card h2{font-size:21px;line-height:1.4;margin:8px 0 10px;font-weight:650}.card .ordinal{color:#6e8774;font-size:12px;letter-spacing:2px}.card .body{white-space:pre-wrap;font-size:16px;color:#526d5d;margin-bottom:16px}.card .q-label{font-size:12px;color:#6f8b74;letter-spacing:1px;margin-top:3px}.card .question{font-size:17px;line-height:1.55;margin:5px 0 15px;white-space:pre-wrap}.card .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:12px}.card .state{padding:3px 9px;border-radius:14px;color:#496253}.card a{color:#18734f;text-decoration:none;border-bottom:1px solid #78a58c}.header-card{background:#e8f1df;border-color:#bbd0ab;border-top-color:#5d8f63;cursor:default}.header-card h2{font-size:24px;margin-top:4px}.header-card .body{font-size:17px;margin:8px 0 0}.header-card .ordinal{letter-spacing:2px}.panel{position:absolute;right:15px;top:15px;bottom:15px;width:min(385px,calc(100% - 30px));padding:27px;background:#fffffc;box-shadow:0 10px 45px #28472925;border:1px solid #c5d8bf;border-radius:15px;overflow:auto;z-index:5}.panel[hidden]{display:none}.panel h2{margin:20px 0 16px;font-size:22px}.panel h3{font-size:12px;color:#718b73;letter-spacing:1px;margin-top:24px}.panel p{white-space:pre-wrap}.panel button{float:right;background:none;border:0;font-size:24px;color:#5c735d;cursor:pointer}.panel a{color:#18734f}.hint{padding:12px 28px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:12px}#parent{font-size:13px;color:#267d5b;text-decoration:none}a[hidden]{display:none}@media(max-width:700px){header{padding:18px 18px 15px}h1{font-size:23px}.toolbar{padding:10px 14px}.toolbar .help{display:none}.workspace{height:60dvh;min-height:400px}.hint{padding:10px 16px}.legend{gap:9px}}@media print{.toolbar,.panel{display:none}.workspace{height:900px;background:none}.hint{display:none}}
</style>
</head>
<body>
<header><div class="eyebrow">KNOWLEDGE MAP · 最小认知闭环</div><div class="topline"><h1 id="title"></h1><span id="map-status" class="badge"></span></div><p id="goal"></p><div class="legend"><span><i class="dot todo"></i>待学习</span><span><i class="dot learning"></i>学习中</span><span><i class="dot mastered"></i>已掌握</span><span><i class="dot skipped"></i>已跳过</span></div></header>
<nav class="toolbar" aria-label="地图工具"><button id="start">从起点看</button><button id="fit">全图总览</button><button id="out" aria-label="缩小">−</button><button id="in" aria-label="放大">＋</button><span id="zoom" class="badge">100%</span><a href="learning-map.canvas" download>下载 Canvas</a><a id="parent" hidden>返回上一层</a><span class="help">拖动空白处平移 · 滚轮缩放 · 点选卡片查看</span></nav>
<main class="workspace"><svg id="stage" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="学习依赖路线图"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#789b81"/></marker></defs><g id="world"></g></svg><aside class="panel" id="panel" hidden aria-label="节点详情"><button id="close" aria-label="关闭详情">×</button><h2 id="detail-title"></h2><h3>学习内容</h3><p id="detail-body"></p><h3>核心问题</h3><p id="detail-question"></p><h3>必要前置</h3><ul id="detail-deps"></ul><p id="detail-state"></p><a id="detail-child" hidden>进入子地图 →</a></aside></main>
<footer class="hint"><span id="summary"></span><span>箭头：前置 → 后续 · 通过对话调整路线</span></footer>
<script id="map-data" type="application/json">__MAP_PAYLOAD__</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('map-data').textContent);
const $=id=>document.getElementById(id),ns='http://www.w3.org/2000/svg',xns='http://www.w3.org/1999/xhtml';
const labels={todo:'待学习',learning:'学习中',mastered:'已掌握',skipped:'已跳过'};
const colors={todo:'#e8efe9',learning:'#e5f0ff',mastered:'#def4e7',skipped:'#eee7f5'};
$('title').textContent=data.topic;document.title=data.topic+' · 知识地图';
$('goal').textContent='学习终点：'+data.closure_goal;
$('map-status').textContent=data.map_status==='locked'?'已锁定':'待你确认';
$('summary').textContent=data.nodes.length+' 个学习模块 · 第 '+data.revision+' 版';
if(data.parent_url){$('parent').hidden=false;$('parent').href=data.parent_url;}
const canvasBy=new Map(data.canvas.nodes.map(n=>[n.id,n]));
const semanticBy=new Map(data.nodes.map(n=>[n.id,n]));
const semanticCanvas=new Map(data.nodes.map(n=>[n.canvas_id,n]));
const split=t=>{const p=t.indexOf('\n');return p<0?[t,'']:[t.slice(0,p),t.slice(p+1).trim()]};
const make=(name,cls,text)=>{const el=document.createElementNS(xns,name);if(cls)el.setAttribute('class',cls);if(text!==undefined)el.textContent=text;return el;};
const world=$('world'),stage=$('stage');
const minX=Math.min(...data.canvas.nodes.map(n=>n.x)),minY=Math.min(...data.canvas.nodes.map(n=>n.y));
const maxX=Math.max(...data.canvas.nodes.map(n=>n.x+n.width)),maxY=Math.max(...data.canvas.nodes.map(n=>n.y+n.height));
let lane=0;
for(const edge of data.canvas.edges){
 const a=canvasBy.get(edge.fromNode),b=canvasBy.get(edge.toNode),sx=a.x+a.width/2,sy=a.y+a.height,tx=b.x+b.width/2,ty=b.y;
 const path=document.createElementNS(ns,'path');
 if(ty-sy>220){const outer=maxX+45+lane++*24;path.setAttribute('d',`M${sx},${sy} V${sy+40} H${outer} V${ty-40} H${tx} V${ty}`);}
 else{const mid=(sy+ty)/2;path.setAttribute('d',`M${sx},${sy} C${sx},${mid} ${tx},${mid} ${tx},${ty}`);}
 path.setAttribute('class','edge');path.setAttribute('marker-end','url(#arrow)');world.appendChild(path);
}
function select(node,element){
 document.querySelectorAll('.card.selected').forEach(e=>e.classList.remove('selected'));element.classList.add('selected');
 const [title,body]=split(node.content);$('detail-title').textContent=title;$('detail-body').textContent=body||node.content;$('detail-question').textContent=node.core_question;$('detail-deps').replaceChildren();
 if(!node.prerequisites.length){const li=document.createElement('li');li.textContent='无骨架内前置';$('detail-deps').appendChild(li);}
 for(const dep of node.prerequisites){const li=document.createElement('li');li.textContent=split(semanticBy.get(dep).content)[0];$('detail-deps').appendChild(li);}
 $('detail-state').textContent='学习状态：'+labels[node.status];$('detail-child').hidden=!node.child_url;if(node.child_url)$('detail-child').href=node.child_url;$('panel').hidden=false;
}
for(const item of data.canvas.nodes){
 const fo=document.createElementNS(ns,'foreignObject');for(const k of ['x','y','width','height'])fo.setAttribute(k,item[k]);
 const node=semanticCanvas.get(item.id),card=make('div','card'+(node?'':' header-card'));
 if(node){
  const [title,body]=split(node.content);card.dataset.nodeId=node.id;card.setAttribute('tabindex','0');card.setAttribute('role','button');card.setAttribute('aria-label',title+'，查看详情');
  card.append(make('div','ordinal','模块 '+String(node.number).padStart(2,'0')),make('h2','',title));
  if(body)card.append(make('div','body',body));card.append(make('div','q-label','核心问题'),make('div','question',node.core_question));
  const foot=make('div','foot'),tag=make('span','state',labels[node.status]);tag.style.background=colors[node.status];foot.append(tag);
  if(node.child_url){const a=make('a','','进入子地图 →');a.href=node.child_url;a.addEventListener('click',e=>e.stopPropagation());foot.append(a);}card.append(foot);
  card.addEventListener('click',()=>select(node,card));card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(node,card);}});
 }else{card.append(make('div','ordinal','学习主干 · '+(data.map_status==='locked'?'已锁定':'待你确认')),make('h2','',data.topic),make('div','body','学习终点：'+data.closure_goal));}
 fo.append(card);world.appendChild(fo);
}
let scale=1,panX=0,panY=0;
function paint(){world.setAttribute('transform',`translate(${panX} ${panY}) scale(${scale})`);$('zoom').textContent=Math.round(scale*100)+'%';}
function fit(){const w=stage.clientWidth,h=stage.clientHeight,totalW=maxX-minX+lane*24+100,totalH=maxY-minY;scale=Math.max(.08,Math.min(1,(w-70)/totalW,(h-60)/totalH));panX=(w-totalW*scale)/2-minX*scale;panY=(h-totalH*scale)/2-minY*scale;paint();}
function zoom(factor,x=stage.clientWidth/2,y=stage.clientHeight/2){const old=scale;scale=Math.max(.08,Math.min(2.6,scale*factor));panX=x-(x-panX)*scale/old;panY=y-(y-panY)*scale/old;paint();}
function start(){const first=canvasBy.get(data.nodes[0].canvas_id);const w=stage.clientWidth;scale=Math.min(.78,Math.max(.42,(w-50)/(maxX-minX)));panX=(w-(maxX-minX)*scale)/2-minX*scale;panY=30-first.y*scale;paint();}
$('start').onclick=start;$('fit').onclick=fit;$('in').onclick=()=>zoom(1.3);$('out').onclick=()=>zoom(1/1.3);$('close').onclick=()=>{$('panel').hidden=true;};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('panel').hidden=true;});
stage.addEventListener('wheel',e=>{e.preventDefault();const rect=stage.getBoundingClientRect();zoom(Math.exp(-e.deltaY*.0015),e.clientX-rect.left,e.clientY-rect.top);},{passive:false});
let drag=null;stage.addEventListener('pointerdown',e=>{if(e.target.closest('.card'))return;drag={x:e.clientX,y:e.clientY,px:panX,py:panY};stage.setPointerCapture(e.pointerId);stage.classList.add('panning');});
stage.addEventListener('pointermove',e=>{if(!drag)return;panX=drag.px+e.clientX-drag.x;panY=drag.py+e.clientY-drag.y;paint();});
function stop(){drag=null;stage.classList.remove('panning');}stage.addEventListener('pointerup',stop);stage.addEventListener('pointercancel',stop);
window.addEventListener('resize',start);requestAnimationFrame(start);
</script>
</body>
</html>
